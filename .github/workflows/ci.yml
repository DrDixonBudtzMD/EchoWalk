name: EchoWalk CI

on:
  push:
    branches: ["The-Citadel"]
  pull_request:
    branches: ["The-Citadel"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-ci --clear
