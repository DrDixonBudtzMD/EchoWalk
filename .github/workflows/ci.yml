name: EchoWalk CI

on:
  push:
    branches: ["The-Citadel"]
  pull_request:
    branches: ["The-Citadel"]

permissions:
  contents: read

jobs:
  validate-js:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npm run typecheck

      - name: Expo dependency compatibility
        run: npx expo install --check

      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir dist-ci --clear

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --clean --platform android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
